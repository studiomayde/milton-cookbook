<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cookbook">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' text-anchor='middle' fill='%23fff'%3EM%3C/text%3E%3C/svg%3E">
<title>Milton Manor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap">
<style>
html,body{margin:0}
html{padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: a fixed list sidebar beside a scrolling workspace; on phones a top bar and a bottom tab bar */
:root{
  --bg:#ffffff; --fg:#111111; --muted:#737373; --faint:#a6a6a6; --line:#e4e4e4; --soft:#f5f5f5; --img:#dadada; --on-fg:#ffffff;
  --glass:rgba(255,255,255,.55); --glass-line:rgba(255,255,255,.8); --scrim:rgba(17,17,17,.42); --danger:#b42318;
  --serif:"Cormorant Garamond", Garamond, "Times New Roman", serif;
  --sans:Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme:light;
}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:12px;line-height:1.5;-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.45}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.kick{font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.lbl{font-size:8px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.serif{font-family:var(--serif)}
.h1{font-family:var(--serif);font-weight:300;font-size:54px;line-height:1.05;letter-spacing:-.01em;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.layout{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
/* sidebar */
.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);padding:32px 20px 28px;display:flex;flex-direction:column;gap:24px}
.logo{font-size:18px;letter-spacing:-.02em;padding:0 12px;background:none;text-align:left}
.logo small{display:block;font-family:var(--serif);font-style:italic;font-size:12px;color:var(--muted);letter-spacing:0}
.stack{display:flex;flex-direction:column;gap:8px}
.secnav{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.secg{border-bottom:1px solid var(--line)}
.secrow{display:flex;align-items:center}
.fx{padding:10px 12px;color:var(--muted);flex:none}
.fx svg.i{width:14px;height:14px;transition:transform .2s;transform:rotate(-90deg)}
.secg.open .fx svg.i{transform:none}
.fx:hover{color:var(--fg)}
.subnav{padding:0 0 14px 29px}
.subnav.anim{overflow:hidden;animation:subdown .45s ease-out}
@keyframes subdown{from{max-height:0;opacity:0;padding-bottom:0}to{max-height:900px;opacity:1}}
@media (prefers-reduced-motion:reduce){.subnav.anim{animation:none}}
.sec{display:flex;align-items:center;gap:12px;padding:15px 12px 16px;flex:1;min-width:0;font-family:var(--serif);font-size:22px;line-height:1;color:var(--muted);text-align:left;width:100%}
.sec svg.i{width:17px;height:17px;flex:none}
.sec:hover{color:var(--fg)}
.sec.on{color:var(--fg)}
.sec.on::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--fg);margin-left:auto}
.nav{display:flex;flex-direction:column;gap:2px}
.fhd{display:flex;align-items:center;justify-content:space-between;width:100%;padding:4px 12px 8px;text-align:left}
.fhd .lbl{padding:0}
.fhd svg.i{width:13px;height:13px;color:var(--muted);transition:transform .2s}
.fhd:hover .lbl,.fhd:hover svg.i{color:var(--fg)}
.fold.shut .fhd svg.i{transform:rotate(-90deg)}
.nav .lbl{padding:0 12px 8px}
.ni{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:4px;font-size:12px;text-align:left;width:100%}
.ni span:last-child{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.ni:hover{background:var(--soft)}
.ni.on{background:var(--fg);color:var(--on-fg);font-weight:500}
.ni.on span:last-child{color:var(--on-fg)}
.addcol{display:flex;gap:8px;align-items:center;padding:6px 12px;color:var(--muted);font-size:11px}
.addcol input{border:0;border-bottom:1px solid var(--line);background:transparent;padding:4px 0;width:100%;outline:none}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;font-size:9px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);background:var(--bg);white-space:nowrap}
.btn.solid{background:var(--fg);color:var(--on-fg);border-color:var(--fg)}
.btn.ink{border-color:var(--fg)}
.btn.sm{padding:8px 14px;font-size:8px}
.btn.wide{width:100%}
.btn.icon{padding:10px;width:38px;height:38px}
.btn:disabled{opacity:.4;cursor:default}
.btn.dangerous{background:var(--danger);border-color:var(--danger);color:#fff}
.link{font-size:9px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;text-decoration:underline;text-underline-offset:3px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* top bar */
.main{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;gap:16px;align-items:center;padding:16px 48px;border-bottom:1px solid var(--line)}
.search{flex:1;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:0 16px;background:var(--bg)}
.search input{border:0;background:transparent;outline:none;padding:11px 0;width:100%;font-size:12px}
.search svg{color:var(--muted)}
.content{padding:44px 48px 72px;max-width:1280px}
.mtop,.tabbar{display:none}
.banner{margin:0 0 24px;padding:12px 16px;border:1px solid var(--line);border-radius:6px;font-size:11px;color:var(--muted)}
/* headers */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.head .tg{display:flex;flex-direction:column;gap:10px}
.sub{font-size:12px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.seg button{padding:8px 16px;border-radius:999px;font-size:8px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.seg button[data-act="ptoday"],.seg button[data-act="stoday"]{font-size:10px}
.seg button.on{background:var(--fg);color:var(--on-fg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-size:8px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;background:var(--bg);white-space:nowrap}
.chip.on{background:var(--fg);color:var(--on-fg);border-color:var(--fg)}
.chip svg.i{width:11px;height:11px;stroke-width:2.4}
select.sort{border:0;background:transparent;font-size:9px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;padding:6px 0}
/* recipe grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:36px 24px;margin-top:28px}
.card{display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;min-width:0}
.pic{position:relative;aspect-ratio:5/4;border-radius:4px;overflow:hidden;background:var(--img);max-width:100%}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:62px;font-weight:300;color:var(--faint)}
.badges{position:absolute;top:10px;right:10px;display:flex;gap:6px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-size:8px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--fg)}
.badge svg.i{width:10px;height:10px;stroke-width:2.6}
.card .k{font-size:8px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card .t{font-family:var(--serif);font-size:20px;line-height:1.12;margin:6px 0 4px;text-wrap:balance}
.card .f{font-size:10px;color:var(--muted)}
.addtile{border:1px dashed var(--faint);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:240px;color:var(--fg)}
.addtile .plus{width:44px;height:44px;border-radius:50%;background:var(--fg);color:var(--on-fg);display:grid;place-items:center}
.addtile .t{font-family:var(--serif);font-size:20px}
.empty{padding:56px 24px;text-align:center;border:1px dashed var(--line);border-radius:6px;margin-top:28px}
.empty .serif{font-size:26px}
/* detail */
.dtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:32px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:9px;font-weight:500;letter-spacing:.1em;text-transform:uppercase}
.hero{display:grid;grid-template-columns:minmax(0,540px) minmax(0,1fr);gap:48px;align-items:start}
.hero .pic{aspect-ratio:27/20}
.info{display:flex;flex-direction:column;gap:20px;min-width:0}
.info h1{font-family:var(--serif);font-weight:400;font-size:50px;line-height:1.05;margin:0;text-wrap:balance}
.intro{font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.35;color:var(--muted);margin:0}
.stats{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{padding:14px 16px;display:flex;flex-direction:column;gap:4px;border-left:1px solid var(--line);min-width:0}
.stats div:first-child{border-left:0;padding-left:0}
.stats b{font-weight:400;font-size:16px}
.from{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.av{width:30px;height:30px;border-radius:50%;background:var(--fg);color:var(--on-fg);display:grid;place-items:center;font-size:10px;font-weight:500}
.body2{display:grid;grid-template-columns:340px minmax(0,1fr);gap:64px;margin-top:48px}
.list .hd{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:12px}
.ing{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line);width:100%;text-align:left;font-size:13px}
.cb{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--faint);display:grid;place-items:center;flex:none;color:var(--on-fg)}
.cb.on{background:var(--fg);border-color:var(--fg)}
.cb svg.i{width:12px;height:12px;stroke-width:2.6}
.done{color:var(--faint);text-decoration:line-through}
.step{display:flex;gap:24px;padding:18px 0;border-top:1px solid var(--line)}
.step .n{font-family:var(--serif);font-size:26px;line-height:1;min-width:34px}
.step p{margin:0;font-size:13px;line-height:1.6;max-width:62ch}
.notes{background:var(--soft);border-radius:6px;padding:24px;margin-top:24px;display:flex;flex-direction:column;gap:10px}
.notes q{font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.35;quotes:none;white-space:pre-wrap}
/* form */
.form{display:grid;grid-template-columns:320px minmax(0,1fr);gap:48px;margin-top:32px}
.fields{display:flex;flex-direction:column;gap:24px;min-width:0}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.in{width:100%;border:1px solid var(--line);border-radius:6px;padding:13px 16px;background:var(--bg);font-size:13px;outline:none}
.in:focus{border-color:var(--fg)}
textarea.in{resize:vertical;line-height:1.55}
.three{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:16px;align-items:end}
.photo{position:relative;border:1px dashed var(--faint);border-radius:6px;background:var(--soft);aspect-ratio:8/7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden;cursor:pointer;max-width:100%}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo .serif{font-size:20px}
.tm{border:1px solid var(--line);border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.tm label{display:flex;gap:14px;align-items:center;cursor:pointer}
.tm .x{padding-top:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.divider{display:flex;align-items:center;gap:16px;color:var(--muted);font-family:var(--serif);font-style:italic;font-size:16px;margin:28px 0 4px}
.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}
.formbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:24px;margin-top:8px;border-top:1px solid var(--line)}
.import{display:flex;flex-direction:column;gap:10px}
/* planner */
.pl{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
.wk{display:grid;gap:0 12px;align-items:center}
.wk .h{padding-bottom:10px}
.wk .day{padding:10px 0;border-top:1px solid var(--line);align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.wk .cell{padding:10px 0;border-top:1px solid var(--line);align-self:stretch;display:flex;align-items:center;min-width:0}
.dnum{font-family:var(--serif);font-size:28px;line-height:1.05}
.slot{display:flex;align-items:center;gap:14px;height:96px;width:100%;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg);text-align:left;padding-right:10px;min-width:0}
.slot .th{width:128px;height:100%;flex:none;background:var(--img);position:relative;overflow:hidden}
.slot .th img{width:100%;height:100%;object-fit:cover}
.slot .th .ph{font-size:34px}
.slot .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.slot .tt{font-family:var(--serif);font-size:20px;line-height:1.18;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.slot .mm{font-size:11px;color:var(--muted)}
.slot .grip{color:var(--faint)}
.slot.swap{outline:2px solid var(--fg);outline-offset:2px}
.slot.over{background:var(--soft)}
.eslot{height:96px;width:100%;border:1px dashed var(--faint);border-radius:6px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:8px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.eslot.over{background:var(--soft);color:var(--fg)}
.hint{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:14px;font-style:italic;font-size:10px;color:var(--muted)}
.swapbar{position:sticky;top:76px;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--fg);color:var(--on-fg);padding:10px 16px;border-radius:999px;margin-bottom:16px;font-size:11px}
.swapbar button{color:var(--on-fg);font-size:8px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;text-decoration:underline}
.daycard{display:flex;flex-direction:column;gap:12px}
.daycard .pic{aspect-ratio:16/7}
.dayrow{display:grid;grid-template-columns:130px minmax(0,1fr);gap:20px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{font-size:8px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-bottom:4px}
.cd{min-height:104px;border:1px solid var(--line);border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0;overflow:hidden}
.cd.out{background:var(--soft);border-color:transparent;color:var(--faint)}
.cd.sel{border-color:var(--fg)}
.cd .n{font-family:var(--serif);font-size:16px;line-height:1.3;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;margin:-2px 0 0 -4px}
.cd .n.today{background:var(--fg);color:var(--on-fg)}
.cd .m{font-size:9px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd .m:before{content:"";width:4px;height:4px;border-radius:50%;background:var(--fg);flex:none}
.dots{display:none;gap:3px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--fg)}
.mweek{display:none}
/* shopping */
.panel{background:var(--soft);border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:18px;min-width:0}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.phead>div{margin-top:0 !important;margin-left:auto;text-align:right;white-space:nowrap}
.panel h2{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.05;margin:0}
.aisle .ah{display:flex;align-items:center;gap:10px;padding-bottom:6px}
.it{display:flex;align-items:center;gap:14px;padding:9px 0;min-height:43px;border-top:1px solid var(--line);width:100%;text-align:left}
.it .nm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;min-width:0;font-size:12px}
.it .q{font-size:11px;color:var(--muted);white-space:nowrap}
.itmain{display:flex;align-items:center;gap:14px;flex:1;min-width:0;text-align:left}
.qin{width:96px;flex:none;border:1px solid transparent;border-bottom-color:var(--line);background:transparent;padding:5px 6px;font-size:12px;text-align:right;color:var(--fg);border-radius:4px;outline:none}
.qin::placeholder{color:var(--muted);opacity:.45}
.qin:hover{border-color:var(--line)}
.qin:focus{border-color:var(--fg);background:var(--bg);text-align:left}
.rt{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border:1px solid var(--line);border-radius:999px;font-family:var(--serif);font-style:italic;font-size:12px;background:var(--bg);white-space:nowrap}
.rt.reg{font-family:var(--sans);font-style:normal;font-size:8px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--soft);border-color:transparent;padding:3px 8px}
.panel .rt.reg{background:var(--bg)}
.trolley{background:var(--soft);border-radius:8px;padding:14px 16px 6px}
.trolley .it{padding:8px 0;min-height:0;font-size:11px}
.trolley .it .nm{font-size:11px}
.count{background:var(--fg);color:var(--on-fg);border-radius:999px;padding:1px 7px;font-size:8px;font-weight:500}
.lcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.lcard{display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--line);border-radius:8px;padding:20px 20px 16px;background:var(--bg);min-height:150px}
.lcard:hover{border-color:var(--fg)}
.lcard .ln{font-family:var(--serif);font-size:26px;line-height:1.05}
.lcard .lm{font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.lcard ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.lcard li{display:flex;gap:8px;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lcard li::before{content:"";width:9px;height:9px;border:1px solid var(--faint);border-radius:2px;flex:none}
.lnew{border-style:dashed;align-items:flex-start;justify-content:center;color:var(--muted)}
.lnote{width:150px;flex:none;border:1px solid transparent;border-bottom-color:var(--line);background:transparent;padding:5px 6px;font-size:11px;text-align:right;color:var(--muted);border-radius:4px;outline:none}
.lnote::placeholder{color:var(--muted);opacity:.45}
.lnote:hover{border-color:var(--line)}
.lnote:focus{border-color:var(--fg);background:var(--bg);text-align:left;color:var(--fg)}
.lit .itmain{flex:0 1 auto;max-width:45%}

  const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});
  const t=await r.text(); if(!r.ok){ const e=new Error(t); e.status=r.status; throw e } return t?JSON.parse(t):null }

/* ---------- store: the family database, kept in sync every few seconds ---------- */
const Store={data:{},subs:{},chains:{},pending:{},since:null,
  async init(){
    try{ const c=JSON.parse(localStorage.getItem('milton-cache')||'null'); if(c&&c.data){ this.data=c.data; this.since=c.since||null } }catch(e){}
    if(!KEY){ S.mode='nokey'; return }
    S.mode='cloud';
    await this.pull(true);
    setInterval(()=>{ if(document.visibilityState==='visible') this.pull() },5000);
    startLive();
    window.addEventListener('focus',()=>this.pull()); window.addEventListener('online',()=>this.pull());
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') this.pull() });
  },
  async pull(first){
    if(this.pulling&&!first){ this.again=true; return } this.pulling=true;
    try{ await this._pull(first) } finally { this.pulling=false; if(this.again){ this.again=false; this.pull() } } },
  async _pull(first){
    let rows;
    try{ const since=(!first&&this.since)?new Date(new Date(this.since).getTime()-15000).toISOString():null;
      rows=await rpc('cookbook_pull',{p_key:KEY,p_since:since}) }
    catch(e){ if(e.status===401||e.status===403){ S.mode='badkey'; render() } else if(first) toast("Can't reach the cookbook. Check your connection."); return }
    if(first){ this.data={} }
    const touched=new Set(first?Object.keys(this.subs):[]);
    for(const r of rows||[]){
      if(!this.since||r.updated_at>this.since) this.since=r.updated_at;
      if(this.pending[r.coll+'/'+r.id]) continue;
      const c=this.data[r.coll]||(this.data[r.coll]={});
      if(r.deleted){ if(c[r.id]){ delete c[r.id]; touched.add(r.coll) } }
      else if(JSON.stringify(c[r.id])!==JSON.stringify(r.data)){ c[r.id]=r.data; touched.add(r.coll) } }
    touched.forEach(c=>this.emit(c));
    if(first||touched.size) this.cache();
  },
  cache(){ try{ localStorage.setItem('milton-cache',JSON.stringify({data:this.data,since:this.since})) }catch(e){} },
  emit(c){ const cb=this.subs[c]; if(cb){ const o=this.data[c]||{}; cb(Object.keys(o).map(id=>Object.assign({id},o[id]))) } },
  sub(c,cb){ this.subs[c]=cb; setTimeout(()=>this.emit(c),0) },
  newId(){ return rid() },
  write(k,fn){ this.pending[k]=(this.pending[k]||0)+1;
    const p=(this.chains[k]||Promise.resolve()).then(fn).then(()=>nudgeOthers()).catch(writeErr).finally(()=>{ if(!--this.pending[k]) delete this.pending[k] });
    this.chains[k]=p; return p },
  set(c,id,data){ const clean=JSON.parse(JSON.stringify(data)); delete clean.id;
    (this.data[c]=this.data[c]||{})[id]=clean; this.emit(c); this.cache();
    return this.write(c+'/'+id,()=>rpc('cookbook_put',{p_key:KEY,p_coll:c,p_id:id,p_data:clean})) },
  del(c,id){ if(this.data[c]) delete this.data[c][id]; this.emit(c); this.cache();
    return this.write(c+'/'+id,()=>rpc('cookbook_del',{p_key:KEY,p_coll:c,p_id:id})) }
};
/* live updates: after any change, tell every other open copy to refresh straight away */
let live=null, nudgeT=null;
async function startLive(){ try{
  await new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc) });
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('milton:'+KEY)); const h=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,24);
  const client=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false}});
  live=client.channel('cookbook-'+h,{config:{broadcast:{self:false}}});
  live.on('broadcast',{event:'changed'},()=>Store.pull()).subscribe(st=>{ if(st==='SUBSCRIBED') Store.pull() });
}catch(e){ live=null } }
function nudgeOthers(){ if(!live) return; clearTimeout(nudgeT); nudgeT=setTimeout(()=>{ try{ live.send({type:'broadcast',event:'changed',payload:{at:Date.now()}}) }catch(e){} },150) }
function writeErr(e){
  if(e&&(e.status===401||e.status===403)){ S.mode='badkey'; render(); return }
  toast("That didn't save. Check your connection and try again.");
}
let toastT;
function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3400) }

/* ---------- derived data ---------- */
const colName=id=>{ if(id==='tm')return'Thermomix'; const c=S.cols.find(c=>c.id===id); return c?c.name:'' };
const R=id=>S.recipes.find(r=>r.id===id);
const colsOf=r=>{ if(!r) return []; if(Array.isArray(r.cols)) return r.cols.filter(id=>S.cols.some(c=>c.id===id)||!S.cols.length); return r.col?[r.col]:[] };
const colNames=r=>colsOf(r).map(colName).filter(Boolean);
function recipeMeta(r){ const t=fmtMins(mins(r.prep)+mins(r.cook)); const n=colNames(r); return [n.length>1?n[0]+' +'+(n.length-1):n[0]||'',t].filter(Boolean).join('  ·  ') }
function listRecipes(kind,id){ let a=S.recipes;
  if(kind==='tried')a=a.filter(r=>r.status==='tried'); else if(kind==='totry')a=a.filter(r=>r.status!=='tried');
  else if(kind==='fav')a=a.filter(r=>r.fav); else if(kind==='tm')a=a.filter(r=>r.tm); else if(kind==='col')a=a.filter(r=>colsOf(r).includes(id));
  return a }
function listTitle(){ const l=UI.list; return {all:'Recipes',tried:'Tried & loved',totry:'To try',fav:'Favourites',tm:'Thermomix',col:colName(l.id)}[l.kind] }
function searchHit(r,q){ q=q.toLowerCase(); return (r.title||'').toLowerCase().includes(q)||(r.ingredients||'').toLowerCase().includes(q)||(r.from||'').toLowerCase().includes(q) }
function sortRecipes(a){ a=a.slice();
  if(UI.sort==='az')a.sort((x,y)=>(x.title||'').localeCompare(y.title||''));
  else if(UI.sort==='quick')a.sort((x,y)=>(mins(x.prep)+mins(x.cook)||999)-(mins(y.prep)+mins(y.cook)||999));
  else a.sort((x,y)=>(y.created||0)-(x.created||0));
  return a }

/* ---------- shopping: parse, classify, aggregate ---------- */
const AISLES=['Fruit & veg','Bakery','Deli','Meat & seafood','Pasta, rice & grains','International','Pantry & baking','Breakfast & cereal','Snacks & drinks','Household','Frozen','Dairy, eggs & fridge','Other'];
const RULES=[
  ['Household',/paper towel|toilet paper|dishwash|detergent|bin bag|cling|foil|baking paper|sponge|soap|tissue/],
  ['Frozen',/frozen|ice cream|edamame/],
  ['International',/curry paste|miso|soy sauce|\bsoy\b|fish sauce|coconut milk|coconut cream|tahini|sesame oil|mirin|sriracha|gochujang|taco|harissa|oyster sauce|rice paper|hoisin|kimchi|wasabi|tortilla/],
  ['Breakfast & cereal',/\boats\b|cereal|muesli|granola|porridge|weet-?bix/],
  ['Snacks & drinks',/chips|crackers|biscuit|chocolate|popcorn|juice|soft drink|coffee|\btea\b|lollies|muesli bar|pretzel/],
  ['Pasta, rice & grains',/pasta|spaghetti|penne|orzo|gnocchi|\brice\b|noodle|couscous|quinoa|risotto|lasagne|linguine|fettuccine|rigatoni|polenta|farro|barley/],
  ['Pantry & baking',/stock|broth|olive oil|\boil\b|vinegar|flour|sugar|baking powder|bicarb|baking soda|vanilla|cocoa|passata|tomato paste|tinned|canned|\bcan\b|honey|maple|jam|peanut butter|nut butter|almond|walnut|pecan|cashew|pine nut|sesame seed|breadcrumb|panko|mustard|mayo|\bsalt\b|\bpepper\b|cumin|paprika|cinnamon|nutmeg|spice|chilli flakes|dried|caper|sauce|gelatin|yeast|chickpeas|lentils/],
  ['Fruit & veg',/sweet potato|spring onion|apple|banana|lemon|lime|orange|berr|grape|pear|mango|peach|plum|melon|sage|basil|parsley|coriander|cilantro|mint|thyme|rosemary|dill|chive|oregano|herb|spinach|kale|lettuce|rocket|salad leaves|broccol|leek|onion|shallot|garlic|ginger|potato|carrot|celery|zucchini|courgette|capsicum|tomato|cucumber|avocado|mushroom|pumpkin|cauliflower|cabbage|bok choy|green beans|snow pea|corn|chilli|chili|eggplant|asparagus|fennel|beetroot|radish/],
  ['Bakery',/bread|sourdough|\bbuns?\b|\brolls?\b|wrap|pita|baguette|croissant|brioche|focaccia/],
  ['Deli',/salami|prosciutto|\bham\b|olive|hummus|pastrami/],
  ['Meat & seafood',/chicken|beef|lamb|pork|mince|bacon|sausage|salmon|fish|prawn|barramundi|tuna steak|steak|thigh|fillet|chuck|duck|veal|mussel|squid|scallop/],
  ['Dairy, eggs & fridge',/milk|butter|cheese|parmesan|parmigiano|cheddar|mozzarella|feta|ricotta|burrata|halloumi|cream|yoghurt|yogurt|\beggs?\b|mascarpone|tofu|pecorino/]
];
function aisleOf(name){ const n=name.toLowerCase(); for(const [a,re] of RULES) if(re.test(n)) return a; return 'Other' }
const UNITS='kg|g|grams?|ml|l|litres?|tsp|tbsp|tablespoons?|teaspoons?|cups?|bunch(?:es)?|cloves?|cans?|tins?|packets?|packs?|jars?|sprigs?|slices?|handfuls?|pinch(?:es)?|heads?|fillets?|pieces?|blocks?|tubs?|bags?|bottles?|dozen';
const QRE=new RegExp('^((?:\\d[\\d.,\\/]*|[½¼¾⅓⅔])(?:\\s*(?:-|to)\\s*\\d+)?\\s*(?:x\\s*)?(?:(?:small|medium|large|big)\\s+)?(?:(?:'+UNITS+')\\b\\.?)?)\\s*(?:of\\s+)?(.+)$','i');
function parseLine(line){
  let l=line.replace(/^[\s•\-*–·]+/,'').trim(); if(!l) return null;
  let qty='',name=l; const m=l.match(QRE); if(m){ qty=m[1].trim(); name=m[2].trim() }
  name=name.replace(/\(.*?\)/g,'').split(',')[0].replace(/\s+/g,' ').trim();
  if(!name) return null;
  if(/^(water|salt and pepper|salt & pepper|sea salt and black pepper|to serve)$/i.test(name)) return null;
  const key=name.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/(\w{3,}?)(es|s)\b/g,(w,a,b)=>/ss$/.test(w)?w:a);
  return {qty,name:name.charAt(0).toUpperCase()+name.slice(1),key};
}
const shortTitle=t=>{ t=t||''; const w=t.split(/\s+/); return w.length<=3?t:w.slice(0,3).join(' ') };
const UNIT_NORM={g:'g',gram:'g',grams:'g',kg:'kg',ml:'ml',l:'L',litre:'L',litres:'L',tsp:'tsp',teaspoon:'tsp',teaspoons:'tsp',tbsp:'tbsp',tbs:'tbsp',tablespoon:'tbsp',tablespoons:'tbsp',cup:'cup',cups:'cup',bunch:'bunch',bunches:'bunch',clove:'clove',cloves:'clove',can:'can',cans:'can',tin:'tin',tins:'tin',pack:'pack',packs:'pack',packet:'pack',packets:'pack',jar:'jar',jars:'jar'};
const FRAC={'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3};
function sumQty(list){ const by={}, other=[];
  for(const raw of list){ const q=String(raw).trim(); if(!q) continue; const m=q.match(/^(\d+(?:[.,]\d+)?(?:\/\d+)?|[½¼¾⅓⅔])\s*([a-zA-Z]*)\.?$/);
    if(!m){ other.push(q); continue }
    let n=FRAC[m[1]]!=null?FRAC[m[1]]:m[1].includes('/')?m[1].split('/').reduce((a,b)=>a/b):parseFloat(m[1].replace(',','.'));
    let u=UNIT_NORM[m[2].toLowerCase()]!=null?UNIT_NORM[m[2].toLowerCase()]:m[2].toLowerCase();
    if(u==='kg'){ n*=1000; u='g' } if(u==='L'){ n*=1000; u='ml' }
    if(!m[2]&&!/^\d/.test(m[1])&&!FRAC[m[1]]){ other.push(q); continue }
    by[u]=(by[u]||0)+n }
  const fmt=(n,u)=>{ if(u==='g'&&n>=1000) return +(n/1000).toFixed(2)+'kg'; if(u==='ml'&&n>=1000) return +(n/1000).toFixed(2)+'L'; const v=+n.toFixed(2); return v+(u?(u.length<=4&&!/^(bunch|clove|can|tin|pack|jar|cup)$/.test(u)?u:' '+u+(v>1&&!/s$/.test(u)?'s':'')):'') };
  return Object.keys(by).map(u=>fmt(by[u],u)).concat(other).join(' + ') }
function shoppingItems(week){
  const map={};
  for(let i=0;i<7;i++){ const d=addDays(week,i); const p=S.plan[d]; if(!p) continue;
    for(const [m] of MEALS){ const r=p[m]&&R(p[m]); if(!r) continue;
      for(const line of String(r.ingredients||'').split('\n')){ const x=parseLine(line); if(!x) continue;
        const it=map[x.key]||(map[x.key]={key:'w:'+x.key,tick:week+'__'+slug(x.key),name:x.name,qtys:[],recipes:[],aisle:aisleOf(x.name)});
        if(x.qty) it.qtys.push(x.qty); const st=shortTitle(r.title); if(!it.recipes.includes(st)) it.recipes.push(st);
      } } }
  const items=Object.values(map).map(it=>Object.assign(it,{qty:sumQty(it.qtys),kind:'recipe'}));
  for(const g of S.regs.filter(g=>g.on)) items.push({key:'r:'+g.id,tick:'reg__'+g.id,name:g.name,qty:g.qty||'',recipes:[],aisle:aisleOf(g.name),kind:'reg',regId:g.id});
  for(const e of S.extras) items.push({key:'e:'+e.id,name:e.name,qty:e.qty||'',recipes:[],aisle:aisleOf(e.name),kind:'extra',extraId:e.id,done:!!e.done});
  for(const it of items){ if(it.kind!=='extra'){ const t=S.ticks[it.tick]; it.done=!!t; it.cleared=!!(t&&t.cleared) }
    it.qkey=it.kind==='recipe'?it.tick:it.key; const ov=S.qtyLocal[it.qkey]!=null?S.qtyLocal[it.qkey]:it.kind==='recipe'&&S.qty[it.tick]?S.qty[it.tick].q:null; if(ov!=null) it.qty=ov }
  return items.filter(it=>!it.cleared);
}

/* ---------- writes ---------- */
function setPlan(date,patch){ const cur=Object.assign({},S.plan[date]||{}); delete cur.id; Object.assign(cur,patch); for(const k in cur) if(cur[k]==null||cur[k]==='') delete cur[k];
  S.plan[date]=Object.assign({id:date},cur); render();
  return Object.keys(cur).length? Store.set('plan',date,cur) : Store.del('plan',date) }
function saveRecipe(r){ const i=S.recipes.findIndex(x=>x.id===r.id); if(i>=0)S.recipes[i]=r; else S.recipes.push(r); return Store.set('recipes',r.id,r) }
function patchRecipe(id,patch){ const r=R(id); if(!r) return; const n=Object.assign({},r,patch,{updated:Date.now()}); return saveRecipe(n) }
function toggleTick(it){
  if(it.kind==='extra'){ const e=S.extras.find(x=>x.id===it.extraId); if(!e)return; e.done=!e.done; render(); return Store.set('extras',e.id,e) }
  if(S.ticks[it.tick]){ delete S.ticks[it.tick]; render(); return Store.del('ticks',it.tick) }
  S.ticks[it.tick]={at:Date.now()}; render(); return Store.set('ticks',it.tick,{at:Date.now()}) }

/* ---------- home ---------- */
function viewDash(){

  const wh=(kick,title,view,link,extra)=>`<div class="wh"><div><div class="kick">${kick}</div><h2>${title}</h2></div><button class="link wl" data-act="go" data-view="${view}"${extra||''}>${link}</button></div>`;
  // meals this week
  let mealRows=''; for(let i=0;i<7;i++){ const d=addDays(wk,i); const p=S.plan[d]||{}; const ms=MEALS.filter(m=>p[m[0]]&&R(p[m[0]]));
    if(!ms.length&&d!==TODAY) continue;
    const dd=parse(d); mealRows+=`<button class="wrow" data-act="dashday" data-date="${d}"><span class="wd${d===TODAY?' today':''}">${d===TODAY?'Today':DAYS_LONG[dd.getDay()].slice(0,3)+' '+dd.getDate()}</span><span class="wt">${ms.length?ms.map(m=>esc(R(p[m[0]]).title)).join('  ·  '):'<span class="muted">Nothing planned</span>'}</span></button>` }
  const meals=`<div class="wg">${wh(weekLabel(wk),'This week','planner','Meal planner')}<div>${mealRows||'<p class="muted" style="margin:0">Nothing planned yet.</p>'}</div></div>`;
  // shopping
  const items=shoppingItems(wk); const todo=items.filter(i=>!i.done);
  const shop=`<div class="wg">${wh(`Total: ${todo.length} item${todo.length===1?'':'s'}`,'Groceries','shopping','Open list')}<div>${todo.slice(0,6).map(i=>`<button class="wrow" data-act="go" data-view="shopping"><span class="cb"></span><span class="wt">${esc(i.name)}</span><span class="wn">${esc(i.qty||'')}</span></button>`).join('')||'<p class="muted" style="margin:0">Nothing on the list yet.</p>'}${todo.length>6?`<div class="wrow muted" style="font-size:11px">+ ${todo.length-6} more</div>`:''}</div></div>`;

  // recipes
  const recent=S.recipes.slice().sort((a,b)=>(b.created||0)-(a.created||0)).slice(0,3); const totry=S.recipes.filter(r=>r.status!=='tried').length;
  const recipes=`<div class="wg">${wh('Recently added','Recipes','home','All recipes')}
    ${recent.length?`<div class="wthumbs">${recent.map(r=>`<button class="wthumb" data-act="open" data-id="${r.id}"><span class="pic">${r.photo?`<img src="${r.photo}" alt="">`:`<span class="ph">${esc((r.title||'?').charAt(0))}</span>`}</span><span class="t">${esc(r.title)}</span></button>`).join('')}</div>`:''}
    <div class="row"><button class="btn" data-act="surprise">${ic('shuffle')} Surprise me</button>${canWrite()?`<button class="btn" data-act="new">${ic('plus')} New recipe</button>`:''}</div></div>`;
  return `<div class="head"><div class="tg"><div class="kick">${esc(longDate(TODAY))}</div><h1 class="h1">${hello}</h1></div></div>
    <div class="dgrid">${shop}${lists}${meals}${recipes}</div>`;

function sortedLists(){ return S.lists.slice().sort((a,b)=>(a.order||0)-(b.order||0)||(a.at||0)-(b.at||0)) }
function itemsOf(lid){ return S.litems.filter(i=>i.list===lid).sort((a,b)=>(a.at||0)-(b.at||0)) }
function liHTML(i){ const w=canWrite();
  return `<div class="it lit"><button class="itmain" data-act="ltick" data-id="${esc(i.id)}"><span class="cb${i.done?' on':''}">${i.done?ic('check'):''}</span><span class="nm"><span class="${i.done?'done':''}">${esc(i.name)}</span>${i.done&&i.sec?(()=>{ const L=S.lists.find(x=>x.id===i.list); const sc=L&&secsOf(L).find(x=>x.id===i.sec); return sc?`<span class="rt">${esc(sc.name)}</span>`:'' })():''}</span></button>${w&&!i.done?`<input class="lnote" id="ln-${esc(i.id)}" data-id="${esc(i.id)}" value="${esc(i.note||'')}" placeholder="Note" aria-label="Note for ${esc(i.name)}" autocomplete="off">`:i.note?`<span class="q">${esc(i.note)}</span>`:''}${w?`<button class="xbtn" data-act="rmlitem" data-id="${esc(i.id)}" aria-label="Remove ${esc(i.name)}">${ic('x')}</button>`:''}</div>` }
function secsOf(L){ return Array.isArray(L.secs)?L.secs:[] }

  if(w) out+=UI.addingSec?`<form class="row" data-form="newsec" style="flex-wrap:nowrap"><input class="in" id="newsec" placeholder="Heading name, e.g. Gift cards" autocomplete="off" style="padding:10px 14px"><button class="btn solid" type="submit">Add</button><button class="link" type="button" data-act="addsecx">Cancel</button></form>`:`<button class="btn" data-act="addsec" style="align-self:flex-start">${ic('plus')} Add heading</button>`;

  if(s.type==='pick'){ const q=(s.q||'').toLowerCase(); const rs=sortRecipes(S.recipes).filter(r=>!q||searchHit(r,q)).sort((a,b)=>(a.title||'').localeCompare(b.title||''));
    const cur=(S.plan[s.date]||{})[s.meal];
    inner=`<div class="sb"><span class="grab"></span><span class="lbl">${esc(longDate(s.date))}</span><h3>Pick a recipe</h3>
      <div class="chips">${MEALS.map(m=>`<button class="chip${s.meal===m[0]?' on':''}" data-act="pickmeal" data-m="${m[0]}">${m[1]}</button>`).join('')}</div>
      <label class="search" style="border-radius:6px">${ic('search')}<input id="pq" placeholder="Search recipes" value="${esc(s.q||'')}" autocomplete="off"></label>
      <div class="plist">${rs.length?rs.map(r=>`<button class="pr" data-act="choose" data-id="${r.id}"><span class="th">${thumb(r)}</span><span style="min-width:0"><span class="serif" style="display:block">${esc(r.title)}</span><span class="muted" style="font-size:9px">${esc(recipeMeta(r))}${r.status==='tried'?'':'  ·  To try'}</span></span>${cur===r.id?`<span style="margin-left:auto">${ic('check')}</span>`:''}</button>`).join(''):`<p class="muted" style="padding:8px">${S.recipes.length?'No recipes match.':'Add some recipes first.'}</p>`}</div>
      ${cur?`<div class="row"><button class="btn" data-act="swapstart">${ic('shuffle')} Swap with another meal</button><button class="btn" data-act="openfromslot">Open recipe</button><button class="btn" data-act="rmslot">${ic('x')} Remove</button></div>`:''}</div>` }
  if(s.type==='plan'){ const r=R(s.rid)||{}; const days=[...Array(14)].map((_,i)=>addDays(TODAY,i));
    inner=`<div class="sb"><span class="grab"></span><span class="lbl">Add to plan</span><h3>${esc(r.title)}</h3>
      <span class="lbl" style="color:var(--fg)">Day</span><div class="chips">${days.map(d=>`<button class="chip${s.date===d?' on':''}" data-act="pday" data-d="${d}">${d===TODAY?'Today':DAYS[(parse(d).getDay()+6)%7]+' '+parse(d).getDate()}</button>`).join('')}</div>
      <span class="lbl" style="color:var(--fg)">Meal</span><div class="chips">${MEALS.map(m=>`<button class="chip${s.meal===m[0]?' on':''}" data-act="pmeal" data-m="${m[0]}">${m[1]}</button>`).join('')}</div>
      ${(S.plan[s.date]||{})[s.meal]&&(S.plan[s.date]||{})[s.meal]!==r.id?`<span class="muted" style="font-size:10px">This replaces ${esc((R(S.plan[s.date][s.meal])||{}).title||'the planned meal')}.</span>`:''}
      <button class="btn solid wide" data-act="doplan">Add to ${s.date===TODAY?'today':esc(longDate(s.date))}</button></div>` }
  return `<div class="scrim" data-act="scrim"><div class="sheet${img?' hasimg':''}" role="dialog" aria-modal="true">${inner}</div></div>`;
}

/* ---------- render with focus preservation ---------- */
function render(){
  const a=document.activeElement; const fid=a&&a.id; let sel=null; try{ if(fid&&a.selectionStart!=null) sel=[a.selectionStart,a.selectionEnd] }catch(e){}
  const keepVals={}; document.querySelectorAll('#view input[id], #view textarea[id]').forEach(el=>{ if(!DRAFT_IDS[el.id]&&el.type!=='file'&&!el.classList.contains('qin')&&!el.classList.contains('lnote')) keepVals[el.id]=el.value });
  const locked=S.mode==='nokey'||S.mode==='badkey'; document.body.classList.toggle('locked',locked);
  if(locked){ $('#gate').innerHTML=`<div class="box"><div class="kick">Milton Manor</div><div class="serif">${S.mode==='nokey'?'Open Milton Manor from the family link':'This link no longer opens Milton Manor'}</div><p class="muted" style="margin:0;font-size:14px">${S.mode==='nokey'?'Ask May to send you the link. Once you open it on this device, it will remember you.':'Ask May for the current family link.'}</p></div>`; return }
  renderSide(); renderTop();
  const v=UI.view==='search'?viewSearch():UI.view==='home'?viewHome():UI.view==='recipe'?viewRecipe():UI.view==='edit'?viewEdit():UI.view==='planner'?viewPlanner():UI.view==='lists'?viewLists():UI.view==='dash'?viewDash():viewShopping();
  $('#view').innerHTML=v;
  for(const id in keepVals){ const el=document.getElementById(id); if(el) el.value=keepVals[id] }
  $('#sheet').innerHTML=sheetHTML();
  if(fid){ const el=document.getElementById(fid); if(el){ el.focus({preventScroll:true}); if(sel&&el.setSelectionRange) try{ el.setSelectionRange(sel[0],sel[1]) }catch(e){} } }
}

/* ---------- draft (edit form) ---------- */
const DRAFT_IDS={'f-title':'title','f-from':'from','f-intro':'intro','f-prep':'prep','f-cook':'cook','f-serves':'serves','f-cookidoo':'cookidoo','f-source':'source','f-ing':'ingredients','f-method':'method','f-notes':'notes'};
function readDraft(){ if(UI.view!=='edit') return; const d=UI.draft; const v=id=>{ const el=document.getElementById(id); return el?el.value:undefined };
  const map={title:'f-title',from:'f-from',intro:'f-intro',prep:'f-prep',cook:'f-cook',serves:'f-serves',cookidoo:'f-cookidoo',source:'f-source',ingredients:'f-ing',method:'f-method',notes:'f-notes'};
  for(const k in map){ const x=v(map[k]); if(x!==undefined) d[k]=x } }
function startEdit(id){ const r=id?R(id):null; const firstCol=(S.cols.slice().sort((a,b)=>(a.order||0)-(b.order||0)).find(c=>/dinner/i.test(c.name))||S.cols[0]||{}).id||'';
  UI.draft=r?JSON.parse(JSON.stringify(r)):{title:'',from:'',intro:'',cols:[UI.list.kind==='col'?UI.list.id:firstCol].filter(Boolean),status:'totry',prep:'',cook:'',serves:'',tm:UI.list.kind==='tm',cookidoo:'',source:'',ingredients:'',method:'',notes:'',photo:''};
  UI.editId=id||null; UI.linkTip=false; UI.importThumb=null; go('edit') }
const readUrl=file=>new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(file) });
const loadImg=url=>new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url });
async function toJpeg(url,max,q){ const img=await loadImg(url); const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
  const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height); return c.toDataURL('image/jpeg',q) }
async function compressUrl(url){ for(const [max,q] of [[1100,.74],[900,.66],[700,.6],[520,.55]]){ const out=await toJpeg(url,max,q); if(out.length<200000) return out } throw new Error('too big') }
async function compress(file){ return compressUrl(await readUrl(file)) }

    case 'copylist': { const L=S.lists.find(x=>x.id===UI.lid); if(!L) break; const todo=itemsOf(L.id).filter(i=>!i.done); const line=i=>`- ${i.name}${i.note?` (${i.note})`:''}`; const ids=new Set(secsOf(L).map(x=>x.id)); let txt=`${L.name}\n`+todo.filter(i=>!i.sec||!ids.has(i.sec)).map(line).join('\n'); for(const sc of secsOf(L)){ const g=todo.filter(i=>i.sec===sc.id); if(g.length) txt+=`\n\n${sc.name}\n`+g.map(line).join('\n') } txt=txt.trim(); try{ await navigator.clipboard.writeText(txt); toast('List copied. Paste it into a message.') }catch(err){ toast("Couldn't copy here. Try again.") } break }

        else if(i.kind==='reg'){ const r=S.regs.find(x=>x.id===i.regId); if(r){ r.on=false; Store.set('regulars',r.id,r) } delete S.ticks[i.tick]; Store.del('ticks',i.tick) }
        else { S.ticks[i.tick]={at:Date.now(),cleared:true}; Store.set('ticks',i.tick,S.ticks[i.tick]) } }

    case 'rmreg': { S.regs=S.regs.filter(x=>x.id!==id); render(); Store.del('regulars',id); break }
    case 'regedit': UI.regEdit=!UI.regEdit; render(); break;
    case 'reggroup': UI.regGroup=t.dataset.g; render(); break;

    case 'dcol': { readDraft(); const d=UI.draft; let a=colsOf(d).slice(); a=a.includes(id)?a.filter(x=>x!==id):a.concat(id); d.cols=a; delete d.col; render(); break }
    case 'dstatus': readDraft(); UI.draft.status=t.dataset.s; render(); break;
    case 'dtm': e.preventDefault(); readDraft(); UI.draft.tm=!UI.draft.tm; render(); break;
    case 'rmphoto': readDraft(); UI.draft.photo=''; render(); break;
    case 'autofill': autofill(); break;
  }
});

/* ---------- free recipe reading: pasted text, photos (on-device text recognition) and links ---------- */
const QTY_START=/^\s*(?:[-•*·]\s*)?(?:\d|[½¼¾⅓⅔⅛]|a\s|an\s|one\s|two\s|three\s|half\s|pinch|handful|splash|dash|few\s)/i;
const ING_WORDS=/\b(g|kg|ml|l|tsp|tbsp|cups?|teaspoons?|tablespoons?|grams?|cloves?|bunch|cans?|tins?|pinch|handful|sprigs?|slices?|large|small|medium)\b/i;
function parseRecipeText(raw){
  const all=String(raw||'').replace(/\r/g,'').split('\n').map(l=>l.replace(/\s+/g,' ').trim());
  const out={title:'',intro:'',prep:'',cook:'',serves:'',ingredients:[],method:[],notes:'',thermomix:false};
  if(!all.some(Boolean)) return out;
  const clean=l=>l.replace(/[:：]$/,'').trim();
  const H_ING=/^(\d+\s+)?(ingredients?|you will need|you'll need|what you need)$/i;
  const H_METH=/^(method|instructions?|directions?|steps|preparation|how to make( it)?|thermomix (method|instructions?)|to make( it)?)$/i;
  const H_NOTE=/^(notes?|tips?|recipe notes|cook'?s notes|variations?|storage)$/i;
  const H_STOP=/^(nutrition|nutritional information|nutrition per serv|per serve|quantities above|share|print|rate this|reviews?|related|you might also)/i;
  const H_ALT=/^(conventional|stove ?top|oven|non-thermomix) (method|instructions?|cooking instructions?)$/i;
  const STEP_MARK=/^step\s*[\dlIO|]{1,2}(\s*[o0]?f\s*[\dlIO|]{1,2}|\s*\/\s*\d+)?[.:]?$/i;
  const letters=l=>{ const t=l.replace(/\s/g,''); return t?(t.match(/[a-z]/gi)||[]).length/t.length:0 };
  let pendingLabels=[];
  const tm=v=>{ v=String(v).trim(); const h=v.match(/(\d+)\s*h/i), m=v.match(/(\d+)\s*m(?!l)/i); if(!h&&!m){ const n=v.match(/^(\d+)$/); return n?n[1]+' min':v } return (h?h[1]+' hr':'')+(h&&m?' ':'')+(m?m[1]+(h?'':' min'):'') };
  const setMeta=(k,v)=>{ if(!v||out[k]) return; out[k]=k==='serves'?String(v).replace(/[^\d\-–]/g,'')||String(v):tm(v) };
  let mode='top', alt=false, para=[]; const top=[], stepsRaw=[];
  const flush=()=>{ if(para.length){ stepsRaw.push(para.join(' ')); para=[] } };
  for(let i=0;i<all.length;i++){ const l=all[i];
    if(!l){ if(mode==='meth') flush(); continue }
    const c=clean(l);
    if(letters(l)<0.45&&!/\d/.test(l)) continue;
    // labels and values split across lines by photo reading, e.g. "Prep" ... "Serves" ... "30m 15"
    if(/^(prep|cook|serves|servings|makes|difficulty)( time)?$/i.test(c)){ pendingLabels.push(c.toLowerCase().split(' ')[0]); continue }
    if(pendingLabels.length&&/^(\d+\s*(m|mins?|h|hrs?|hours?)?\s*)+$/i.test(c)){ const vals=c.match(/\d+\s*(?:mins?|m|hrs?|h|hours?)?/gi)||[]; let vi=0;
      for(const lb of pendingLabels){ if(lb==='difficulty') continue; const v=vals[vi++]; if(!v) break; if(lb==='prep')setMeta('prep',v); else if(lb==='cook')setMeta('cook',v); else setMeta('serves',v) } pendingLabels=[]; continue }
    // a row of labels with the values on the next line, e.g. "Prep  Serves  Difficulty" / "30m  15"
    if(/^(prep|cook|total|serves|servings|makes|difficulty)(\s+(prep|cook|total|serves|servings|makes|difficulty)(\s+time)?)+$/i.test(c)&&all[i+1]){
      const labels=c.toLowerCase().split(/\s+/).filter(w=>w!=='time'), vals=all[i+1].split(/\s+/);
      labels.forEach((lb,j)=>{ const v=vals[j]; if(!v) return; if(lb==='prep')setMeta('prep',v); else if(lb==='cook')setMeta('cook',v); else if(/serv|makes/.test(lb))setMeta('serves',v) }); i++; continue }
    let m;
    if((m=c.match(/^prep(?:aration)?(?: time)?\s*[:\-]?\s*(\d.*)$/i))){ setMeta('prep',m[1]); continue }
    if((m=c.match(/^cook(?:ing)?(?: time)?\s*[:\-]?\s*(\d.*)$/i))){ setMeta('cook',m[1]); continue }
    if((m=c.match(/^(?:serves|servings?|makes|yield)\s*[:\-]?\s*(\d.*)$/i))){ setMeta('serves',m[1]); continue }
    if(/^(total(?: time)?|difficulty|calories)\b/i.test(c)) continue;
    if(H_STOP.test(c)){ if(mode==='meth') flush(); mode='skip'; continue }
    if(H_ALT.test(c)&&(stepsRaw.length||para.length)){ flush(); alt=true; continue }
    if(H_ING.test(c)){ flush(); mode='ing'; alt=false; continue }
    if(H_METH.test(c)){ flush(); if(!(alt||stepsRaw.length&&/thermomix/i.test(c)===false&&mode==='meth')) mode='meth'; alt=false; continue }
    if(H_NOTE.test(c)){ flush(); mode='note'; alt=false; continue }
    if(mode==='skip'||alt) continue;
    if(mode==='top') top.push(l);
    else if(mode==='ing'){ if(/[:]$/.test(l)&&!QTY_START.test(l)) continue; if(!/\d/.test(l)&&l.split(' ').length<=4&&l.split(' ').every(w=>/^[A-Z&]/.test(w))) continue; out.ingredients.push(l.replace(/^[-•*·▢☐□]\s*/,'')) }
    else if(mode==='meth'){
      if(STEP_MARK.test(c)){ flush(); continue }
      const num=l.match(/^(?:step\s*)?(\d+)[.):]\s*(.*)$/i);
      if(num){ flush(); if(num[2]) para.push(num[2]); continue }
      para.push(l.replace(/^[-•*·]\s*/,''));
      if(/[.!?)]$/.test(l)&&para.join(' ').length>140&&!all[i+1]) flush() }
    else if(mode==='note') out.notes+=(out.notes?' ':'')+l.replace(/^[-•*·]\s*/,'');
  }
  flush();
  out.method=stepsRaw.map(x=>x.replace(/\s+/g,' ').replace(/([.!?])\s+[\d|]{1,2}$/,'$1').trim()).filter(x=>x.length>2&&letters(x)>0.5);
  out.ingredients=out.ingredients.filter(x=>letters(x)>0.45);
  // no headings found: sort lines by how they look
  if(!out.ingredients.length&&!out.method.length){ const rest=top.slice(1);
    for(const l of rest){ if((QTY_START.test(l)||ING_WORDS.test(l))&&l.length<90) out.ingredients.push(l.replace(/^[-•*·]\s*/,'')); else if(l.length>25) out.method.push(l.replace(/^(?:step\s*)?\d+[.):]?\s+/i,'')) }
    top.length=Math.min(top.length,1) }
  const titleOk=l=>l.length>2&&l.length<90&&!/https?:|www\.|\||\.com|©|—/i.test(l)&&/[a-z]{3}/.test(l)&&letters(l)>0.75;
  out.title=(top.find(titleOk)||'').replace(/^recipe[:\s]+/i,'').replace(/\s+recipe$/i,'');
  const introLine=top.find(l=>l!==out.title&&titleOk(l)&&l.length>30&&l.length<240); if(introLine) out.intro=introLine;
  out.thermomix=/thermomix|\bspeed \d|\bmc (on|off)\b|varoma|\breverse\b.*speed/i.test(raw);
  out.title=out.title.charAt(0).toUpperCase()+out.title.slice(1);
  return out;
}

  }catch(e){ UI.importing=null; render(); toast(navigator.onLine===false?"You're offline. Check your connection and try again.":"Reading links needs the free populate function in Supabase (see the README). You can paste the recipe text instead.") } }
let ocrLib=null;
function loadOcr(){ if(ocrLib) return ocrLib; ocrLib=new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'; sc.onload=()=>res(window.Tesseract); sc.onerror=()=>{ ocrLib=null; rej(new Error('ocr')) }; document.head.appendChild(sc) }); return ocrLib }
async function ocrFiles(list,progressId){
  const T=await loadOcr(); let text=''; let cur=0;
  const worker=await T.createWorker('eng',1,{logger:m=>{ if(m.status==='recognizing text'){ const p=Math.round(((cur+m.progress)/list.length)*100); if(p!==UI.ocr){ UI.ocr=p; const el=document.getElementById(progressId); if(el) el.textContent=p+'%' } } }});
  await worker.setParameters({tessedit_pageseg_mode:'3'});
  for(let i=0;i<list.length;i++){ cur=i; const img=await toJpeg(await readUrl(list[i]),2200,.92); const res=await worker.recognize(img); text+=(res&&res.data&&res.data.text||'')+'\n\n' }
  await worker.terminate(); return text }
const looksLikeRecipe=r=>r.ingredients.length>=2||r.method.length>=2;
async function importImages(files){ readDraft(); const list=Array.from(files).slice(0,4); if(!list.length) return;
  UI.importing='image'; UI.ocr=0; render();
  try{ const text=await ocrFiles(list,'ocrp');
    UI.importing=null; const rec=parseRecipeText(text); const n=looksLikeRecipe(rec)||rec.title?applyRecipe(rec):0;
    try{ const first=await readUrl(list[0]); UI.importThumb=await compressUrl(first); if(!UI.draft.photo) UI.draft.photo=UI.importThumb }catch(e){}
    render(); const ft=document.getElementById('f-title'); if(ft) ft.scrollIntoView({behavior:'smooth',block:'center'});
    toast(n?'Filled in from the photo. Check it over, especially quantities, then save.':"Couldn't read a recipe in that photo. Try a clearer, straight-on shot.");
  }catch(e){ UI.importing=null; render(); toast("Couldn't read the photo. Check your connection and try again.") } }
async function scanPhoto(file){ if(UI.scanning) return; UI.scanning=true; UI.ocr=0; render();
  try{ const text=await ocrFiles([file],'scanp'); UI.scanning=false; if(UI.view!=='edit'){ return } readDraft();
    const rec=parseRecipeText(text); const n=looksLikeRecipe(rec)?applyRecipe(rec):0; render();
    if(n){ toast('Found a recipe in the photo and filled in the form. Check it over, then save.'); const ft=document.getElementById('f-title'); if(ft) ft.scrollIntoView({behavior:'smooth',block:'center'}) }
  }catch(e){ UI.scanning=false; if(UI.view==='edit') render() } }

/* ---------- boot ---------- */
render();
Store.init().then(()=>{
  render();
  Store.sub('recipes',d=>{ S.recipes=d; S.loaded.recipes=true; if(UI.view!=='edit') soon(); else renderSide() });
  Store.sub('collections',d=>{ S.cols=d; S.loaded.cols=true; if(UI.view!=='edit') soon(); else renderSide() });
  Store.sub('plan',d=>{ S.plan={}; d.forEach(p=>S.plan[p.id]=p); if(UI.view!=='edit') soon() });
  Store.sub('ticks',d=>{ S.ticks={}; d.forEach(t=>S.ticks[t.id]=t); if(UI.view!=='edit') soon() });
  Store.sub('extras',d=>{ S.extras=d; if(UI.view!=='edit') soon() });
  Store.sub('lists',d=>{ S.lists=d; if(UI.view!=='edit') soon(); else renderSide() });
  Store.sub('litems',d=>{ S.litems=d; if(UI.view!=='edit') soon() });
  Store.sub('regulars',d=>{ S.regs=d; if(UI.view!=='edit') soon() });
  Store.sub('qty',d=>{ S.qty={}; d.forEach(q=>S.qty[q.id]=q); if(UI.view!=='edit') soon() });
});

})();
</script>
